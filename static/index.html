<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HGH 个人拍机助手</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --card: #141e33;
      --border: #24324d;
      --text: #e6edf7;
      --muted: #8ca0c2;
      --accent: #38bdf8;
      --highlight: #f43f5e;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 72px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 18, 32, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 16px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .btn {
      background: var(--accent);
      color: #08101e;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    main { padding: 12px 14px; max-width: 720px; margin: 0 auto; }
    .filter-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: grid;
      gap: 8px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 12px;
      color: var(--muted);
      min-width: 44px;
    }
    .chip {
      background: #0d1526;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #08101e;
      border-color: var(--accent);
      font-weight: 700;
    }
    .section-title {
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 8px;
      display: flex;
      justify-content: space-between;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card.watched {
      border-color: var(--highlight);
      box-shadow: 0 0 0 1px rgba(244, 63, 94, 0.35);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .title { font-weight: 700; font-size: 15px; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1f2d47;
      color: var(--accent);
      white-space: nowrap;
    }
    .badge.hot { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
    .badge.warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge.ok { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    .thumb {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 8px;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 58px;
    }
    nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    nav button.active { color: var(--accent); font-weight: 700; }
    .hidden { display: none; }
    .form-grid { display: grid; gap: 8px; margin-bottom: 12px; }
    input, select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0d1526;
      color: var(--text);
      font-size: 14px;
    }
    .links { margin-top: 8px; display: flex; gap: 8px; }
    .links a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .time-grid {
      display: grid;
      grid-template-columns: 44px repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
      background: #0d1526;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      align-items: center;
    }
    .time-grid .tg-head { font-size: 12px; color: var(--muted); }
    .time-grid .tg-val { font-size: 14px; font-weight: 600; color: var(--text); }
    .time-grid .tg-val.actual { color: var(--ok); }
    .time-grid .tg-val.est { color: var(--accent); }
    .time-grid .tg-val.selected {
      background: rgba(56, 189, 248, 0.16);
      border-radius: 6px;
      padding: 2px 6px;
      outline: 1px solid var(--accent);
    }
    .metar-bar {
      background: #101a2e;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .metar-bar b { color: var(--ok); }
    #radarMap {
      height: 300px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>HGH 萧山拍机雷达</h1>
      <div class="meta" id="statusText">等待更新...</div>
    </div>
    <button class="btn" onclick="manualRefresh()">刷新</button>
  </header>

  <main>
    <!-- HGH 实时风向与跑道建议 -->
    <div id="metarBar" class="metar-bar">正在获取 HGH 实时风向天气...</div>

    <!-- 全局双筛选栏 -->
    <div id="dualFilterBar" class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">机型:</span>
        <button class="chip active" onclick="setBodyFilter('全部', this)">全部</button>
        <button class="chip" onclick="setBodyFilter('宽体机', this)">宽体机</button>
        <button class="chip" onclick="setBodyFilter('窄体机', this)">窄体机</button>
        <button class="chip" onclick="setBodyFilter('货机', this)">货机</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">涂装:</span>
        <button class="chip active" onclick="setLiveryFilter('全部', this)">全部</button>
        <button class="chip" onclick="setLiveryFilter('仅彩绘', this)">仅彩绘</button>
        <button class="chip" onclick="setLiveryFilter('非彩绘', this)">非彩绘</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">进出港:</span>
        <button class="chip active" onclick="setPhaseFilter('全部', this)">全部</button>
        <button class="chip" onclick="setPhaseFilter('进港', this)">进港</button>
        <button class="chip" onclick="setPhaseFilter('出港', this)">出港</button>
        <button class="chip" onclick="setPhaseFilter('过境', this)">过境</button>
      </div>
    </div>

    <!-- Tab 1: 实时雷达 -->
    <section id="tab-radar">
      <div class="section-title">
        <span>HGH 周边全量观测（彩绘与关注置顶）</span>
        <span>
          <button class="btn-ghost" onclick="airlabsBlindFill()">AirLabs补盲</button>
          <button class="btn-ghost" onclick="toggleMap()" id="mapToggleBtn">展开地图</button>
          <span id="radarCount" style="margin-left:6px;">0 架</span>
        </span>
      </div>
      <div id="radarMap" class="hidden"></div>
      <div id="radarList"></div>
    </section>

    <!-- Tab 2: 1-2天规律预测 -->
    <section id="tab-pred" class="hidden">
      <div class="section-title">
        <span>近 14 天串飞规律（全量观测积累）</span>
      </div>
      <div id="predList"></div>
    </section>

    <!-- Tab 3: HGH 历史跑道记录 -->
    <section id="tab-runway" class="hidden">
      <div class="section-title"><span>HGH 跑道分布统计 (06/24 · 07/25)</span></div>
      <div id="runwayStats" class="card"></div>
      <div class="section-title"><span>历史降落日志</span></div>
      <div id="runwayLogs"></div>
    </section>

    <!-- Tab 4: HGH 今日进出港时刻表 -->
    <section id="tab-sched" class="hidden">
      <div class="filter-bar" style="margin-bottom:8px;">
        <div class="filter-row">
          <span class="filter-label">口径:</span>
          <button class="chip active" onclick="setSchedTimeType('计划', this)">计划</button>
          <button class="chip" onclick="setSchedTimeType('预计', this)">预计</button>
          <button class="chip" onclick="setSchedTimeType('实际', this)">实际</button>
        </div>
        <div class="filter-row" style="justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="filter-label">起降:</span>
            <button class="chip" onclick="setSchedLeg('起飞', this)">起飞</button>
            <button class="chip active" onclick="setSchedLeg('落地', this)">落地</button>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn-ghost" id="schedSortBtn" onclick="toggleSchedSort()">时间 ↑</button>
            <button class="btn-ghost" onclick="refreshSchedules()">同步</button>
          </div>
        </div>
      </div>
      <div class="section-title">
        <span id="schedTitle">按「计划落地」排序</span>
        <span id="schedCount">0 班</span>
      </div>
      <div id="schedList"></div>
    </section>

    <!-- Tab 5: 关注清单管理 -->
    <section id="tab-watch" class="hidden">
      <div class="card">
        <div class="title" style="margin-bottom:8px;">添加彩绘机 / 货机</div>
        <div class="form-grid">
          <input id="inReg" placeholder="注册号，如 B-2021（必填，自动查 Hex）" />
          <input id="inLivery" placeholder="涂装/备注名，如 进博号 / 顺丰747" />
          <select id="inCategory">
            <option value="彩绘客机">彩绘客机</option>
            <option value="彩绘货机">彩绘货机</option>
            <option value="货机">货机（普通涂装）</option>
            <option value="普通关注">普通关注（非彩绘客机）</option>
          </select>
          <input id="inHex" placeholder="Hex 编码（可选，留空自动查 hexdb.io）" />
          <button class="btn" onclick="addWatch()">添加到监控清单</button>
        </div>
      </div>
      <div class="section-title"><span>当前监控清单</span></div>
      <div id="watchList"></div>
    </section>
  </main>

  <nav style="grid-template-columns: repeat(5, 1fr);">
    <button class="active" onclick="switchTab('radar', this)">实时雷达</button>
    <button onclick="switchTab('sched', this)">今日进出港</button>
    <button onclick="switchTab('pred', this)">航线预测</button>
    <button onclick="switchTab('runway', this)">跑道记录</button>
    <button onclick="switchTab('watch', this)">关注清单</button>
  </nav>

  <script>
    let currentTab = 'radar';
    let filterBody = '全部';
    let filterLivery = '全部';
    let filterPhase = '全部';
    let cachedRadar = null;
    let cachedSched = null;
    let cachedPreds = null;
    let cachedRunways = null;
    let schedTimeType = '计划';
    let schedLeg = '落地';
    let schedSortAsc = true;
    let mapOpen = false;
    let leafletMap = null;
    let aircraftLayer = null;

    function toggleMap() {
      mapOpen = !mapOpen;
      const el = document.getElementById('radarMap');
      el.classList.toggle('hidden', !mapOpen);
      document.getElementById('mapToggleBtn').textContent = mapOpen ? '收起地图' : '展开地图';
      if (mapOpen) {
        initMapIfNeeded();
        setTimeout(() => { leafletMap.invalidateSize(); if (cachedRadar) renderRadar(cachedRadar); }, 100);
      }
    }

    function initMapIfNeeded() {
      if (leafletMap || typeof L === 'undefined') return;
      leafletMap = L.map('radarMap').setView([30.2371, 120.4319], 10);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 18,
      }).addTo(leafletMap);

      // 绘制 HGH 两条跑道及约 15km 五边延长线
      const runways = [
        [[30.171, 120.285], [30.287, 120.577], '07 / 25 跑道'],
        [[30.187, 120.275], [30.301, 120.571], '06 / 24 跑道'],
      ];
      runways.forEach(([p1, p2, label]) => {
        L.polyline([p1, p2], { color: '#38bdf8', weight: 2, dashArray: '5,5', opacity: 0.7 }).addTo(leafletMap).bindTooltip(label);
      });
      aircraftLayer = L.layerGroup().addTo(leafletMap);
    }

    function updateMapMarkers(list) {
      if (!mapOpen || !leafletMap || !aircraftLayer) return;
      aircraftLayer.clearLayers();
      list.forEach(ac => {
        if (ac.lat == null || ac.lon == null) return;
        const color = ac.is_special_livery ? '#f43f5e' : (ac.flight_phase === '进港' ? '#22c55e' : '#38bdf8');
        const marker = L.circleMarker([ac.lat, ac.lon], {
          radius: ac.is_special_livery ? 8 : 5,
          color,
          fillColor: color,
          fillOpacity: 0.85,
        });
        marker.bindPopup(`<b>${ac.livery_name || ac.reg || ac.callsign || ac.hex}</b><br/>${ac.model || '-'} · ${ac.flight_phase}<br/>高度 ${ac.alt_ft} ft · 距HGH ${ac.dist_hgh_km} km`);
        marker.addTo(aircraftLayer);
      });
    }

    function matchDualFilter(item) {
      if (filterBody !== '全部' && (item.body_type || '其他') !== filterBody) return false;
      const isSpecial = Boolean(item.is_special_livery);
      if (filterLivery === '仅彩绘' && !isSpecial) return false;
      if (filterLivery === '非彩绘' && isSpecial) return false;
      if ((currentTab === 'radar' || currentTab === 'sched') && filterPhase !== '全部' && (item.flight_phase || '过境') !== filterPhase) return false;
      return true;
    }

    function setBodyFilter(val, el) {
      filterBody = val;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      rerenderActiveTab();
    }

    function setLiveryFilter(val, el) {
      filterLivery = val;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      rerenderActiveTab();
    }

    function setPhaseFilter(val, el) {
      filterPhase = val;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      rerenderActiveTab();
    }

    function rerenderActiveTab() {
      if (currentTab === 'radar' && cachedRadar) renderRadar(cachedRadar);
      if (currentTab === 'sched' && cachedSched) renderSchedules(cachedSched);
      if (currentTab === 'pred' && cachedPreds) renderPredictions(cachedPreds);
      if (currentTab === 'runway' && cachedRunways) renderRunways(cachedRunways);
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
      document.getElementById('dualFilterBar').classList.toggle('hidden', tab === 'watch');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      if (tab === 'radar') loadRadar();
      if (tab === 'sched') loadSchedules();
      if (tab === 'pred') loadPredictions();
      if (tab === 'runway') loadRunways();
      if (tab === 'watch') loadWatchlist();
    }

    async function manualRefresh() {
      document.getElementById('statusText').textContent = '正在多源并发拉取 ADS-B...';
      const res = await fetch('/api/radar/refresh', { method: 'POST' });
      cachedRadar = await res.json();
      renderRadar(cachedRadar);
    }

    async function airlabsBlindFill() {
      document.getElementById('statusText').textContent = '正在调用 AirLabs 补盲（耗 1 次额度）...';
      const res = await fetch('/api/radar/airlabs', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) return alert(data.detail || 'AirLabs 补盲失败');
      cachedRadar = data;
      renderRadar(cachedRadar);
    }

    function renderAircraftCard(ac) {
      const route = (ac.origin || ac.dest) ? `${ac.origin || '?'} → ${ac.dest || '?'}` : '航线未知';
      const eta = ac.eta_hgh_min ? `预计 ${ac.eta_hgh_min} 分钟后到 HGH` : '';
      const alt = ac.alt_ft < 90000 ? `${ac.alt_ft} ft` : '未知高度';
      const trend = ac.baro_rate < -150 ? '↓下降' : (ac.baro_rate > 150 ? '↑爬升' : '→平飞');
      const img = ac.img_url ? `<img class="thumb" src="${ac.img_url}" loading="lazy" />` : '';
      const regOrCallsign = ac.reg || ac.callsign || ac.hex;
      const fr24Url = ac.reg
        ? `https://www.flightradar24.com/data/aircraft/${ac.reg.toLowerCase()}`
        : `https://www.flightradar24.com/${ac.callsign || ''}`;
      const liveryBadge = ac.is_special_livery ? `<span class="badge hot">彩绘</span>` : '';
      const airlabsBadge = ac.from_airlabs ? `<span class="badge">补盲</span>` : '';
      const phaseBadgeClass = ac.flight_phase === '进港' ? 'ok' : (ac.flight_phase === '出港' ? 'warn' : '');
      const phaseBadge = `<span class="badge ${phaseBadgeClass}">${ac.flight_phase || '过境'}</span>`;
      const bodyBadgeClass = ac.body_type === '货机' ? 'warn' : (ac.body_type === '宽体机' ? 'ok' : '');
      const bodyBadge = `<span class="badge ${bodyBadgeClass}">${ac.body_type || '其他'}</span>`;

      const schedLine = (ac.arr_sched || ac.arr_est || ac.arr_actual)
        ? `<br/>时刻表: 计划 ${ac.arr_sched || '-'} · 预计 ${ac.arr_est || '-'} · 实际 ${ac.arr_actual || '-'}`
        : '';

      return `
        <div class="card ${ac.is_special_livery || ac.is_watched ? 'watched' : ''}">
          <div class="row">
            <div class="title">${ac.livery_name || regOrCallsign}</div>
            <div class="badges">${liveryBadge}${airlabsBadge}${phaseBadge}${bodyBadge}</div>
          </div>
          <div class="sub">
            注册号: <b>${ac.reg || '-'}</b> · 机型: ${ac.model || '-'} · 呼号: ${ac.callsign || '-'}<br/>
            航线: <b>${route}</b> ${eta ? `· <span style="color:var(--ok)">${eta}</span>` : ''}${schedLine}<br/>
            距 HGH: <b>${ac.dist_hgh_km ?? '-'} km</b> · 高度: ${alt} (${trend}) · 航向: ${ac.track_deg ?? '-'}°
          </div>
          ${img}
          <div class="links">
            <a href="${fr24Url}" target="_blank">FR24 详情</a>
          </div>
        </div>
      `;
    }

    function renderRadar(data) {
      const m = data.metar || {};
      document.getElementById('metarBar').innerHTML = m.raw
        ? `<span>ZSHC 天气: 风向 <b>${m.wdir ?? '-'}°</b> ${m.wspd_kt ?? 0}kt · ${m.temp_c ?? '-'}°C · 能见度 ${m.visib_km ?? '-'}km</span><span>建议蹲: <b>${m.suggested_runway || '-'}</b></span>`
        : '<span>ZSHC 实时天气加载中...</span>';

      const srcInfo = data.sources_total
        ? ` · ${data.sources_ok.length}/${data.sources_total}源 · ${data.poll_interval_seconds}s`
        : '';
      document.getElementById('statusText').textContent = data.last_error
        ? `异常: ${data.last_error}`
        : `更新于 ${data.last_updated || '尚未完成首次轮询'}${srcInfo}`;

      const watchedRemote = (data.watchlist_live || []).filter(x => (x.dist_hgh_km ?? 9999) > 470);
      const merged = [...(data.hgh_nearby || []), ...watchedRemote];
      const filtered = merged.filter(matchDualFilter);
      document.getElementById('radarCount').textContent = `${filtered.length} / ${merged.length} 架`;
      document.getElementById('radarList').innerHTML = filtered.length
        ? filtered.map(renderAircraftCard).join('')
        : '<div class="card sub">当前筛选条件下暂无雷达目标（可切换上方筛选或点击“刷新”）。</div>';
      updateMapMarkers(filtered);
    }

    async function loadRadar() {
      const res = await fetch('/api/radar');
      cachedRadar = await res.json();
      renderRadar(cachedRadar);
    }

    function renderPredictions(rows) {
      const filtered = rows.filter(matchDualFilter);
      document.getElementById('predList').innerHTML = filtered.length
        ? filtered.map(r => `
          <div class="card ${r.is_special_livery ? 'watched' : ''}">
            <div class="row">
              <div class="title">${r.livery_name || r.reg} (${r.model || '-'})</div>
              <div class="badges">
                ${r.is_special_livery ? '<span class="badge hot">彩绘</span>' : ''}
                <span class="badge">${r.body_type || '其他'}</span>
                <span class="badge ${r.confidence === '高' ? 'ok' : ''}">${r.match_window}</span>
              </div>
            </div>
            <div class="sub">
              注册号: ${r.reg} · 呼号: ${r.callsign || '-'}<br/>
              常飞航线: <b>${r.origin_icao || '?'} → ${r.dest_icao || '?'}</b> · 近14天出现 ${r.freq} 次<br/>
              最近记录: ${r.last_seen_at}
            </div>
          </div>
        `).join('')
        : '<div class="card sub">暂无符合当前筛选条件的历史规律记录。</div>';
    }

    function setSchedTimeType(val, el) {
      schedTimeType = val;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      if (cachedSched) renderSchedules(cachedSched);
    }

    function setSchedLeg(val, el) {
      schedLeg = val;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      if (cachedSched) renderSchedules(cachedSched);
    }

    function toggleSchedSort() {
      schedSortAsc = !schedSortAsc;
      document.getElementById('schedSortBtn').textContent = schedSortAsc ? '时间 ↑' : '时间 ↓';
      if (cachedSched) renderSchedules(cachedSched);
    }

    function getSelectedSchedField() {
      const prefix = schedLeg === '起飞' ? 'dep_' : 'arr_';
      const suffix = schedTimeType === '计划' ? 'time' : (schedTimeType === '预计' ? 'estimated' : 'actual');
      return prefix + suffix;
    }

    function fmtHM(ts) {
      if (!ts) return '--:--';
      const parts = String(ts).trim().split(' ');
      return parts.length >= 2 ? parts[1].slice(0, 5) : String(ts).slice(0, 5);
    }

    function renderSchedules(data) {
      if (!data.configured) {
        document.getElementById('schedList').innerHTML = `
          <div class="card sub">
            <b>尚未配置 AirLabs 免费 API Key</b><br/><br/>
            1. 前往 <b>airlabs.co</b> 注册免费账号并复制 API Key。<br/>
            2. 在终端运行：<br/>
            <code>export AIRLABS_API_KEY="你的Key"</code><br/>
            <code>cd ~/Desktop/hgh-plane-spotter && ./scripts/install_launchd.sh</code><br/><br/>
            配置后即可在此查看 HGH 当日所有进出港航班的<b>计划 / 预计 / 实际起降时间</b>。
          </div>`;
        return;
      }
      const field = getSelectedSchedField();
      document.getElementById('schedTitle').textContent = `按「${schedTimeType}${schedLeg}」${schedSortAsc ? '升序' : '降序'}排列`;

      const rows = (data.rows || []).filter(matchDualFilter).slice().sort((a, b) => {
        const va = a[field] || '';
        const vb = b[field] || '';
        if (!va && !vb) return 0;
        if (!va) return 1;
        if (!vb) return -1;
        return schedSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      });

      document.getElementById('schedCount').textContent = `${rows.length} 班`;
      document.getElementById('schedList').innerHTML = rows.length
        ? rows.map(s => {
          const dir = s.direction || s.flight_phase || '进港';
          const dirClass = dir === '进港' ? 'ok' : 'warn';
          const csTxt = (s.codeshares && s.codeshares.length)
            ? ` · 共享: ${s.codeshares.join('/')}`
            : '';
          const sel = (f) => (f === field ? 'selected' : '');
          return `
          <div class="card">
            <div class="row">
              <div class="title">${s.flight_iata || s.flight_icao} · ${s.dep_iata || '?'} → ${s.arr_iata || '?'}</div>
              <div class="badges">
                <span class="badge ${dirClass}">${dir}</span>
                <span class="badge">${s.body_type || '其他'}</span>
                <span class="badge">${s.status || '-'}</span>
              </div>
            </div>
            <div class="sub">机型: <b>${s.aircraft_icao || '-'}</b> · 呼号: ${s.flight_icao || '-'}${csTxt}</div>
            <div class="time-grid">
              <div class="tg-head"></div>
              <div class="tg-head">计划</div>
              <div class="tg-head">预计</div>
              <div class="tg-head">实际</div>

              <div class="tg-head">起飞</div>
              <div class="tg-val ${sel('dep_time')}">${fmtHM(s.dep_time)}</div>
              <div class="tg-val est ${sel('dep_estimated')}">${fmtHM(s.dep_estimated)}</div>
              <div class="tg-val actual ${sel('dep_actual')}">${fmtHM(s.dep_actual)}</div>

              <div class="tg-head">落地</div>
              <div class="tg-val ${sel('arr_time')}">${fmtHM(s.arr_time)}</div>
              <div class="tg-val est ${sel('arr_estimated')}">${fmtHM(s.arr_estimated)}</div>
              <div class="tg-val actual ${sel('arr_actual')}">${fmtHM(s.arr_actual)}</div>
            </div>
          </div>`;
        }).join('')
        : '<div class="card sub">暂无符合条件的进出港时刻表记录，可点击右上角“同步”。</div>';
    }

    async function loadSchedules() {
      const res = await fetch('/api/schedules');
      cachedSched = await res.json();
      renderSchedules(cachedSched);
    }

    async function refreshSchedules() {
      const res = await fetch('/api/schedules/refresh', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) return alert(data.detail || '同步失败');
      await loadSchedules();
    }

    async function loadPredictions() {
      const res = await fetch('/api/predictions');
      cachedPreds = await res.json();
      renderPredictions(cachedPreds);
    }

    function renderRunways(data) {
      const stats = data.stats || [];
      document.getElementById('runwayStats').innerHTML = stats.length
        ? stats.map(s => `<div class="sub">跑道 <b>${s.runway_ident}</b>：共 ${s.cnt} 次（其中白天可拍 ${s.daylight_cnt || 0} 次）</div>`).join('')
        : '<div class="sub">暂无跑道统计数据。</div>';

      const logs = (data.logs || []).filter(matchDualFilter);
      document.getElementById('runwayLogs').innerHTML = logs.length
        ? logs.map(l => `
          <div class="card ${l.is_special_livery ? 'watched' : ''}">
            <div class="row">
              <div class="title">${l.livery_name || l.reg || l.hex} → 跑道 ${l.runway_ident}</div>
              <div class="badges">
                ${l.is_special_livery ? '<span class="badge hot">彩绘</span>' : ''}
                <span class="badge">${l.body_type || '其他'}</span>
                <span class="badge ${l.is_daylight ? 'ok' : ''}">${l.is_daylight ? '白天' : '夜间'}</span>
              </div>
            </div>
            <div class="sub">
              呼号: ${l.callsign || '-'} · 机型: ${l.model || '-'} · 最低捕获高度: ${l.min_alt_ft} ft<br/>
              落地时间: ${l.landed_at}
            </div>
          </div>
        `).join('')
        : '<div class="card sub">暂无符合当前筛选条件的降落跑道记录。</div>';
    }

    async function loadRunways() {
      const res = await fetch('/api/runways');
      cachedRunways = await res.json();
      renderRunways(cachedRunways);
    }

    async function loadWatchlist() {
      const res = await fetch('/api/watchlist');
      const rows = await res.json();
      document.getElementById('watchList').innerHTML = rows.length
        ? rows.map(w => `
          <div class="card">
            <div class="row">
              <div class="title">${w.livery_name || w.reg}</div>
              <button class="btn-ghost" onclick="delWatch('${w.hex}')">移除</button>
            </div>
            <div class="sub">
              注册号: ${w.reg} · Hex: ${w.hex} · 机型: ${w.model || '-'} · 分类: ${w.category}
            </div>
          </div>
        `).join('')
        : '<div class="card sub">监控清单为空，请在上方添加彩绘机或货机注册号。</div>';
    }

    async function addWatch() {
      const reg = document.getElementById('inReg').value.trim();
      if (!reg) return alert('请填写注册号');
      const res = await fetch('/api/watchlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reg,
          livery_name: document.getElementById('inLivery').value.trim(),
          category: document.getElementById('inCategory').value,
          hex: document.getElementById('inHex').value.trim(),
        }),
      });
      const data = await res.json();
      if (!res.ok) return alert(data.detail || '添加失败');
      document.getElementById('inReg').value = '';
      document.getElementById('inLivery').value = '';
      document.getElementById('inHex').value = '';
      loadWatchlist();
    }

    async function delWatch(hex) {
      await fetch('/api/watchlist/' + hex, { method: 'DELETE' });
      loadWatchlist();
    }

    loadRadar();
    setInterval(() => { if (currentTab === 'radar') loadRadar(); }, 10000);
  </script>
</body>
</html>
